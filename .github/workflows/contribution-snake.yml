name: Generate contribution web

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate comic contribution animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23F0142F&color_dots=%23E9EEF5,%23A8C8FF,%235E8CFF,%232D5BFF,%230B1F3A
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF2D45&color_dots=%23111627,%23231B4A,%23482575,%238E2B68,%23F0142F

      - name: Publish animation branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

