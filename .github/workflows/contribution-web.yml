# Redraws the contribution panel in `assets/` from GitHub's own calendar.
#
# The README used to embed a third-party image service, which owned the uptime
# and the theme. This owns both: `scripts/contribution-web.mjs` prints the SVG
# and the commit below is the only thing the README has to trust.
#
# Private contributions are counted only when GH_PROFILE_TOKEN is set — a
# classic PAT with `read:user`. Without it the panel falls back to the built-in
# token and counts public activity alone.
name: Contribution web

on:
  schedule:
    # 08:10 UTC — a little after 03:00 in Bogotá, so the day is settled.
    - cron: '10 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/contribution-web.mjs'
      - '.github/workflows/contribution-web.yml'

permissions:
  contents: write

concurrency:
  group: contribution-web
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw the panel
        env:
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contribution-web.mjs --user ${{ github.repository_owner }} --out assets

      - name: Commit it only if the year moved
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-web-*.svg
          # [skip ci]: the panel is a drawing, and nothing downstream — CI or the
          # Vercel deploy of `web/` — needs to run again because of it.
          git commit -m 'chore: redraw the contribution web [skip ci]'
          git push
