<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">JLDEV comic developer banner</title>
  <desc id="description">An original red and navy comic panel with halftone dots, web lines and developer typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset="0.56" stop-color="#0b1735"/>
      <stop offset="1" stop-color="#03040a"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#f0142f" opacity=".38"/>
    </pattern>
    <pattern id="blueDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#4c7dff" opacity=".3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="9" stdDeviation="0" flood-color="#000" flood-opacity=".75"/>
    </filter>
    <clipPath id="slash"><path d="M0 0H1280V420H0z"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#slash)">
    <path d="M-70 430L355-40h250L180 430z" fill="#f0142f"/>
    <path d="M75 430L500-40h82L158 430z" fill="#ffb000" opacity=".9"/>
    <path d="M-40 420L380 0h220L180 420z" fill="url(#dots)"/>
    <path d="M935-60h420v500H760z" fill="url(#blueDots)"/>
    <path d="M790 0l490 420M885 0l395 335M980 0l300 250M1075 0l205 165M1170 0l110 80" stroke="#e8eef9" stroke-width="3" opacity=".24"/>
    <path d="M1280 115c-135 0-240-36-315-115M1280 205c-228 0-382-70-465-205M1280 300C950 300 760 185 695 0M1280 395C830 395 605 240 560 0" fill="none" stroke="#e8eef9" stroke-width="3" opacity=".24"/>
  </g>
  <g transform="translate(62 62) rotate(-4 150 150)" filter="url(#shadow)">
    <path d="M42 26L315 4l52 52-31 269-279 18L5 285z" fill="#080b16" stroke="#f7f8fc" stroke-width="9"/>
    <path d="M42 26L315 4l52 52-31 269-279 18L5 285z" fill="url(#dots)" opacity=".55"/>
    <text x="185" y="132" text-anchor="middle" fill="#fff" font-family="Arial Black,Impact,sans-serif" font-size="76" letter-spacing="-5">JLDEV</text>
    <path d="M68 158h233" stroke="#ffb000" stroke-width="12"/>
    <text x="185" y="211" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="5">CODE HERO</text>
    <text x="185" y="260" text-anchor="middle" fill="#ffb000" font-family="monospace" font-size="18" font-weight="700">ISSUE #1227</text>
  </g>
  <g filter="url(#shadow)">
    <text x="470" y="142" fill="#fff" font-family="Arial Black,Impact,sans-serif" font-size="69" letter-spacing="2">BACKEND • AI</text>
    <text x="470" y="218" fill="#f0142f" stroke="#fff" stroke-width="2" paint-order="stroke" font-family="Arial Black,Impact,sans-serif" font-size="72" letter-spacing="1">AUTOMATION</text>
    <path d="M468 245h650" stroke="#ffb000" stroke-width="12"/>
    <text x="470" y="299" fill="#e8eef9" font-family="monospace" font-size="25" font-weight="700" letter-spacing="3">BUILD. AUTOMATE. SCALE.</text>
    <text x="470" y="350" fill="#8ba9e8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">TU DESARROLLADOR AMIGABLE DEL VECINDARIO</text>
    <text x="470" y="381" fill="#8ba9e8" font-family="Arial,Helvetica,sans-serif" font-size="17">YOUR FRIENDLY NEIGHBORHOOD DEVELOPER</text>
  </g>
  <g transform="translate(1150 62)">
    <path d="M0 45L40 0l45 38-42 48z" fill="#fff" stroke="#f0142f" stroke-width="8"/>
    <path d="M54 102l50-6 7 50-55 8z" fill="#ffb000" stroke="#fff" stroke-width="7"/>
  </g>
</svg>

