<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">JLDEV comic developer banner</title>
  <desc id="description">An original red, blue and cream comic panel with halftone dots, web lines and developer typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.6" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#dce8ff"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="3" fill="#cf102d" opacity=".35"/></pattern>
    <pattern id="blueDots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.4" fill="#174baf" opacity=".24"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="8" dy="9" stdDeviation="0" flood-color="#081022" flood-opacity=".75"/></filter>
    <clipPath id="slash"><path d="M0 0H1280V420H0z"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)" stroke="#081022" stroke-width="6"/>
  <g clip-path="url(#slash)">
    <path d="M-70 430L355-40h250L180 430z" fill="#cf102d"/>
    <path d="M75 430L500-40h82L158 430z" fill="#ffb000"/>
    <path d="M-40 420L380 0h220L180 420z" fill="url(#dots)"/>
    <path d="M935-60h420v500H760z" fill="url(#blueDots)"/>
    <path d="M790 0l490 420M885 0l395 335M980 0l300 250M1075 0l205 165M1170 0l110 80" stroke="#174baf" stroke-width="3" opacity=".28"/>
    <path d="M1280 115c-135 0-240-36-315-115M1280 205c-228 0-382-70-465-205M1280 300C950 300 760 185 695 0M1280 395C830 395 605 240 560 0" fill="none" stroke="#174baf" stroke-width="3" opacity=".28"/>
  </g>
  <g transform="translate(62 62) rotate(-4 150 150)" filter="url(#shadow)">
    <path d="M42 26L315 4l52 52-31 269-279 18L5 285z" fill="#0b1f3a" stroke="#fff" stroke-width="9"/>
    <path d="M42 26L315 4l52 52-31 269-279 18L5 285z" fill="url(#dots)" opacity=".55"/>
    <text x="185" y="132" text-anchor="middle" fill="#fff" font-family="Arial Black,Impact,sans-serif" font-size="76" letter-spacing="-5">JLDEV</text>
    <path d="M68 158h233" stroke="#ffb000" stroke-width="12"/>
    <text x="185" y="211" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="5">CODE HERO</text>
    <text x="185" y="260" text-anchor="middle" fill="#ffb000" font-family="monospace" font-size="18" font-weight="700">ISSUE #1227</text>
  </g>
  <g filter="url(#shadow)">
    <text x="470" y="142" fill="#0b1f3a" stroke="#fff" stroke-width="3" paint-order="stroke" font-family="Arial Black,Impact,sans-serif" font-size="69" letter-spacing="2">BACKEND • AI</text>
    <text x="470" y="218" fill="#cf102d" stroke="#fff" stroke-width="3" paint-order="stroke" font-family="Arial Black,Impact,sans-serif" font-size="72">AUTOMATION</text>
    <path d="M468 245h650" stroke="#ffb000" stroke-width="12"/>
    <text x="470" y="299" fill="#0b1f3a" font-family="monospace" font-size="25" font-weight="700" letter-spacing="3">BUILD. AUTOMATE. SCALE.</text>
    <text x="470" y="350" fill="#174baf" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">TU DESARROLLADOR AMIGABLE DEL VECINDARIO</text>
    <text x="470" y="381" fill="#174baf" font-family="Arial,Helvetica,sans-serif" font-size="17">YOUR FRIENDLY NEIGHBORHOOD DEVELOPER</text>
  </g>
</svg>

